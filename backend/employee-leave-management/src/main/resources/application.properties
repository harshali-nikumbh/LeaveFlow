
spring.application.name=employee-leave-management

# MySQL database connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/employee_leave_management
spring.datasource.username=leave_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server configuration
server.port=${PORT:8080}




# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for password reset links
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

app.cookie.secure=${COOKIE_SECURE:false}

# Optimize startup on Render
spring.main.lazy-initialization=true
